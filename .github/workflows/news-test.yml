name: Test News Launcher Only

on:
  workflow_dispatch:
  push:
    branches:
      - news-on-latest
    paths:
      - '.github/workflows/news-test.yml'
      - 'src/**'
      - 'assets/**'
      - 'android/launcher/**'

permissions:
  contents: read

jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Build the page
        run: python3 src/build.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Use the project's release certificate so the test launcher can read the
      # signature-protected city configuration from the installed screensaver.
      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Android signing secrets are missing"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      # Make the test package independent from the production app and directly launchable
      # from the TV app list; HOME alone does not create an app-drawer launch button.
      - name: Prepare test manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/launcher/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('android:name="sa.urtv.home.READ_NOW_PLAYING"', 'android:name="sa.urtv.home.news.READ_NOW_PLAYING"')
          s = s.replace('android:readPermission="sa.urtv.home.READ_NOW_PLAYING"', 'android:readPermission="sa.urtv.home.news.READ_NOW_PLAYING"')
          s = s.replace('android:authorities="sa.urtv.home.nowplaying"', 'android:authorities="sa.urtv.home.news.nowplaying"')
          s = s.replace('android:authorities="sa.urtv.home.adhan"', 'android:authorities="sa.urtv.home.news.adhan"')
          # Keep HOME resolution separate from ordinary app launching.
          # Android TV installers can leave Open disabled if launcher categories
          # are mixed into the HOME intent filter.
          needle = '''            <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>'''
          replacement = needle + '''
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>'''
          activity_start = s.find('android:name=".MainActivity"')
          activity_end = s.find('android:name=".DockActivity"')
          activity = s[activity_start:activity_end]
          if 'android.intent.category.LEANBACK_LAUNCHER' not in activity:
              if needle not in s:
                  raise SystemExit("Could not find MainActivity HOME intent filter")
              s = s.replace(needle, replacement, 1)
          p.write_text(s)
          PY

      - name: Build launcher only
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          URTV_BRANCH: ${{ github.ref_name }}
        run: gradle -p android :launcher:assembleRelease --no-daemon

      - name: Prepare test APK
        run: cp android/launcher/build/outputs/apk/release/launcher-release.apk urtv-home-news-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: urtv-home-news-test
          path: urtv-home-news-test.apk
          if-no-files-found: error
