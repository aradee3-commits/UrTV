name: Test News Launcher Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Build the page
        run: python3 src/build.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # This is an isolated test APK (applicationId sa.urtv.home.news).
      # Use Gradle's debug signing key; do not require the production keystore.
      - name: Build launcher only
        env:
          URTV_BRANCH: ${{ github.ref_name }}
        run: gradle -p android :launcher:assembleRelease --no-daemon

      - name: Prepare test APK
        run: cp android/launcher/build/outputs/apk/release/launcher-release.apk urtv-home-news-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: urtv-home-news-test
          path: urtv-home-news-test.apk
          if-no-files-found: error
